<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Biblioteca - Integrado</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <i data-lucide="book-open-check" class="w-8 h-8 text-amber-400"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Biblioteca Integrada</h1>
          <p class="text-xs text-indigo-300">PostgreSQL • MongoDB • Python • PHP</p>
        </div>
      </div>

      <!-- Barra de Busca Instantânea (Sem Scroll) -->
      <div class="relative w-full md:w-96">
        <input 
          type="text" 
          id="campoBusca" 
          placeholder="Buscar livro por título, autor ou ID..." 
          oninput="filtrarLivros()"
          class="w-full pl-10 pr-4 py-2 rounded-lg bg-indigo-800 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm"
        >
        <i data-lucide="search" class="w-4 h-4 text-indigo-300 absolute left-3 top-3"></i>
      </div>

      <button onclick="abrirModalUsuario()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-indigo-950 font-semibold rounded-lg text-sm flex items-center gap-2 shadow transition">
        <i data-lucide="user-plus" class="w-4 h-4"></i> Novo Leitor
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- Abas -->
    <div class="flex border-b border-slate-300 mb-6 gap-6">
      <button id="tab-catalogo" onclick="alternarAba('catalogo')" class="pb-2 border-b-2 border-indigo-600 font-bold text-indigo-600 text-sm flex items-center gap-2">
        <i data-lucide="book-marked" class="w-4 h-4"></i> Catálogo de Livros
      </button>
      <button id="tab-usuarios" onclick="alternarAba('usuarios')" class="pb-2 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 text-sm flex items-center gap-2">
        <i data-lucide="users" class="w-4 h-4"></i> Leitores Cadastrados
      </button>
      <button id="tab-logs" onclick="alternarAba('logs')" class="pb-2 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 text-sm flex items-center gap-2">
        <i data-lucide="database" class="w-4 h-4"></i> Auditoria NoSQL (MongoDB)
      </button>
    </div>

    <!-- SEÇÃO 1: CATÁLOGO -->
    <section id="sec-catalogo">
      <div id="gridLivros" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
      <div id="semResultados" class="hidden text-center py-16 text-slate-500">
        <i data-lucide="search-x" class="w-12 h-12 mx-auto mb-2 opacity-40"></i>
        <p class="text-base font-medium">Nenhum livro encontrado.</p>
      </div>
    </section>

    <!-- SEÇÃO 2: USUÁRIOS -->
    <section id="sec-usuarios" class="hidden">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
          <h2 class="font-bold text-slate-700">Lista de Leitores (PostgreSQL)</h2>
          <input type="text" id="buscaUsuarioInput" oninput="filtrarUsuarios()" placeholder="Filtrar leitor..." class="px-3 py-1.5 border rounded-lg text-sm w-64">
        </div>
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-600 border-b">
            <tr>
              <th class="p-3">ID</th>
              <th class="p-3">Nome</th>
              <th class="p-3">CPF</th>
              <th class="p-3">E-mail</th>
              <th class="p-3">Telefone</th>
            </tr>
          </thead>
          <tbody id="tabelaUsuarios"></tbody>
        </table>
      </div>
    </section>

    <!-- SEÇÃO 3: LOGS -->
    <section id="sec-logs" class="hidden">
      <div class="bg-slate-900 text-emerald-400 p-5 rounded-xl font-mono text-sm shadow-inner max-h-[500px] overflow-y-auto">
        <div class="text-xs text-slate-400 pb-3 border-b border-slate-800 mb-3">Coleção: eventos_sistema (MongoDB)</div>
        <div id="containerLogs" class="space-y-3"></div>
      </div>
    </section>

  </main>

  <!-- MODAL NOVO LEITOR -->
  <div id="modalUsuario" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-indigo-900 mb-4">Cadastrar Novo Leitor</h3>
      <form onsubmit="salvarUsuario(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Nome Completo</label>
          <input type="text" id="cadNome" required class="w-full p-2.5 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">CPF</label>
          <input type="text" id="cadCPF" required placeholder="000.000.000-00" class="w-full p-2.5 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">E-mail</label>
          <input type="email" id="cadEmail" required class="w-full p-2.5 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Telefone</label>
          <input type="text" id="cadTelefone" required placeholder="(81) 98888-8888" class="w-full p-2.5 border rounded-lg text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" onclick="fecharModalUsuario()" class="px-4 py-2 text-slate-600 text-sm">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EMPRÉSTIMO -->
  <div id="modalEmprestimo" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-indigo-900 mb-2">Confirmar Empréstimo</h3>
      <p id="empLivroTitulo" class="text-sm font-semibold text-slate-700 mb-4 bg-indigo-50 p-3 rounded-lg"></p>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Selecione o Leitor</label>
          <select id="empUsuarioSelect" class="w-full p-2.5 border rounded-lg text-sm bg-white" size="4"></select>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="fecharModalEmprestimo()" class="px-4 py-2 text-slate-600 text-sm">Cancelar</button>
          <button type="button" onclick="confirmarEmprestimo()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-sm">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    let livros = [
      { id: 1, titulo: "Estruturas de Dados e Algoritmos com Python", autor: "Bruno R.", disponivel: 3, total: 5, genero: "Tecnologia" },
      { id: 2, titulo: "Banco de Dados Relacionais e NoSQL", autor: "Carlos A.", disponivel: 1, total: 2, genero: "Engenharia" },
      { id: 3, titulo: "Sistemas Distribuídos e Microsserviços", autor: "Mariana F.", disponivel: 0, total: 4, genero: "Tecnologia" },
      { id: 4, titulo: "Clean Code: Código Limpo", autor: "Robert C. Martin", disponivel: 5, total: 5, genero: "Programação" }
    ];

    let usuarios = [
      { id: 1, nome: "Luis Victor", cpf: "123.456.789-00", email: "luis@email.com", telefone: "(81) 99999-1111" },
      { id: 2, nome: "Ana Beatris", cpf: "987.654.321-11", email: "ana@email.com", telefone: "(81) 98888-2222" }
    ];

    async function carregarUsuariosDoBanco() {
  try {
    const resposta = await fetch("/api/usuarios");

    if (!resposta.ok) {
      throw new Error("Erro ao buscar usuários do banco.");
    }

    const dados = await resposta.json();

    usuarios = dados;

    renderizarUsuarios(usuarios);

    console.log("Usuários carregados do PostgreSQL:", usuarios);

  } catch (erro) {
    console.error("Erro:", erro);
    alert("Não foi possível carregar os usuários do PostgreSQL.");
  }
}

    let logs = [
      { id: "65b_init", tipo_evento: "SISTEMA_INIT", detalhes: "Auditoria MongoDB iniciada.", id_usuario: null, id_livro: null, data: new Date().toLocaleTimeString() }
    ];

    let livroSelecionadoId = null;

    async function carregarLivrosDoBanco() {
    try {
        const resposta = await fetch("/api/livros");

        if (!resposta.ok) {
            throw new Error("Erro ao buscar livros do banco.");
        }

        const dados = await resposta.json();

        livros = dados;

        renderizarLivros(livros);

        console.log("Livros carregados do PostgreSQL:", livros);

    } catch (erro) {
        console.error("Erro:", erro);
        alert("Não foi possível carregar os livros do PostgreSQL.");
    }
}

    document.addEventListener("DOMContentLoaded", async () => {
    await carregarLivrosDoBanco();
    await carregarUsuariosDoBanco();

    await carregarLogsDoBanco();
    lucide.createIcons();
});

    function renderizarLivros(lista) {
      const grid = document.getElementById("gridLivros");
      const semRes = document.getElementById("semResultados");
      grid.innerHTML = "";
      if (lista.length === 0) { semRes.classList.remove("hidden"); return; }
      semRes.classList.add("hidden");

      lista.forEach(livro => {
        const disponivel = livro.disponivel > 0;
        grid.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition border border-slate-200 p-5 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-600">ID #${livro.id}</span>
                <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${disponivel ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                  ${disponivel ? `${livro.disponivel} disp.` : 'Esgotado'}
                </span>
              </div>
              <h3 class="font-bold text-slate-800 text-base mb-1">${livro.titulo}</h3>
              <p class="text-xs text-slate-500 mb-3">Autor: ${livro.autor}</p>
            </div>
            <button onclick="abrirModalEmprestimo(${livro.id})" ${!disponivel ? 'disabled' : ''} class="w-full py-2 px-3 rounded-lg text-xs font-bold transition flex items-center justify-center gap-2 ${disponivel ? 'bg-indigo-600 hover:bg-indigo-700 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
              Emprestar
            </button>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function filtrarLivros() {
      const termo = document.getElementById("campoBusca").value.toLowerCase();
      const filtrados = livros.filter(l => l.titulo.toLowerCase().includes(termo) || l.autor.toLowerCase().includes(termo) || l.id.toString() === termo);
      renderizarLivros(filtrados);
    }

    async function salvarUsuario(e) {
  e.preventDefault();

  const novoU = {
    nome: document.getElementById("cadNome").value,
    cpf: document.getElementById("cadCPF").value,
    email: document.getElementById("cadEmail").value,
    telefone: document.getElementById("cadTelefone").value
  };

  try {
    const resposta = await fetch("/api/usuarios", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(novoU)
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(dados.erro || "Erro ao cadastrar usuário.");
    }

    usuarios.push(dados);

    renderizarUsuarios(usuarios);
    fecharModalUsuario();
    e.target.reset();

    alert("Leitor cadastrado com sucesso!");

  } catch (erro) {
    console.error("Erro:", erro);
    alert("Não foi possível cadastrar o leitor: " + erro.message);
  }
}

    function renderizarUsuarios(lista) {
      const tb = document.getElementById("tabelaUsuarios");
      tb.innerHTML = "";
      lista.forEach(u => {
        tb.innerHTML += `
          <tr class="border-b hover:bg-slate-50">
            <td class="p-3 font-mono text-xs">#${u.id}</td>
            <td class="p-3 font-semibold text-slate-700">${u.nome}</td>
            <td class="p-3 text-slate-500">${u.cpf}</td>
            <td class="p-3 text-slate-500">${u.email}</td>
            <td class="p-3 text-slate-500">${u.telefone}</td>
          </tr>
        `;
      });
    }

    function filtrarUsuarios() {
      const termo = document.getElementById("buscaUsuarioInput").value.toLowerCase();
      const filtrados = usuarios.filter(u => u.nome.toLowerCase().includes(termo) || u.cpf.includes(termo));
      renderizarUsuarios(filtrados);
    }

    function abrirModalEmprestimo(idLivro) {
      const livro = livros.find(l => l.id === idLivro);
      livroSelecionadoId = idLivro;
      document.getElementById("empLivroTitulo").innerText = `Livro: ${livro.titulo}`;
      const select = document.getElementById("empUsuarioSelect");
      select.innerHTML = "";
      usuarios.forEach(u => { select.innerHTML += `<option value="${u.id}">${u.nome} (CPF: ${u.cpf})</option>`; });
      document.getElementById("modalEmprestimo").classList.remove("hidden");
    }

    function fecharModalEmprestimo() { document.getElementById("modalEmprestimo").classList.add("hidden"); }

    async function confirmarEmprestimo() {
  const idUsuario = parseInt(document.getElementById("empUsuarioSelect").value);
  const idLivro = livroSelecionadoId;

  if (!idUsuario || !idLivro) {
    alert("Selecione um usuário e um livro.");
    return;
  }

  try {
    const resposta = await fetch("/api/emprestimos", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id_usuario: idUsuario,
        id_livro: idLivro
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(dados.erro || "Erro ao realizar empréstimo.");
    }

    await carregarLivrosDoBanco();

    fecharModalEmprestimo();

    alert("Empréstimo realizado com sucesso!");

  } catch (erro) {
    console.error("Erro:", erro);
    alert("Não foi possível realizar o empréstimo: " + erro.message);
  }
}

    async function carregarLogsDoBanco() {
  try {
    const resposta = await fetch("/api/logs");
    const dados = await resposta.json();

    logs = dados.map(log => ({
      id: 'mongo_' + Math.random().toString(16).substr(2, 6),
      tipo_evento: log.tipo_evento,
      detalhes: log.detalhes,
      id_usuario: log.id_usuario,
      id_livro: log.id_livro,
      data: log.timestamp
        ? new Date(log.timestamp).toLocaleString("pt-BR")
        : "Sem data"
    }));

    renderizarLogs();

  } catch (erro) {
    console.error("Erro ao carregar logs do MongoDB:", erro);
  }
}

    function renderizarLogs() {
      const container = document.getElementById("containerLogs");
      container.innerHTML = "";
      logs.forEach(log => {
        container.innerHTML += `
          <div class="border-l-2 border-emerald-500 pl-3 py-1 bg-slate-800/40 rounded-r">
            <div class="text-[10px] text-slate-400 flex justify-between">
              <span class="text-emerald-400 font-bold">${log.tipo_evento}</span>
              <span>${log.data}</span>
            </div>
            <p class="text-xs text-slate-200 mt-1">${log.detalhes}</p>
            <div class="text-[10px] text-slate-500 mt-0.5">id_usuario: ${log.id_usuario || 'null'} | id_livro: ${log.id_livro || 'null'}</div>
          </div>
        `;
      });
    }

    function alternarAba(aba) {
      document.getElementById("sec-catalogo").classList.add("hidden");
      document.getElementById("sec-usuarios").classList.add("hidden");
      document.getElementById("sec-logs").classList.add("hidden");

      document.getElementById("tab-catalogo").className = "pb-2 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 text-sm flex items-center gap-2";
      document.getElementById("tab-usuarios").className = "pb-2 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 text-sm flex items-center gap-2";
      document.getElementById("tab-logs").className = "pb-2 border-b-2 border-transparent text-slate-500 hover:text-indigo-600 text-sm flex items-center gap-2";

      document.getElementById(`sec-${aba}`).classList.remove("hidden");
      document.getElementById(`tab-${aba}`).className = "pb-2 border-b-2 border-indigo-600 font-bold text-indigo-600 text-sm flex items-center gap-2";
    }

    function abrirModalUsuario() { document.getElementById("modalUsuario").classList.remove("hidden"); }
    function fecharModalUsuario() { document.getElementById("modalUsuario").classList.add("hidden"); }
  </script>
</body>
</html>
